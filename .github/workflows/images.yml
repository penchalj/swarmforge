name: Images

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Image build and scan (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            image_scope: dev-image
            fallback_cache: bazel-Linux
          - arch: arm64
            runner: ubuntu-24.04-arm
            image_scope: dev-image-arm64
            fallback_cache: bazel-arm64
    env:
      SKIP_IMAGE_BUILD: "1"
      BAZEL_CACHE_DIR: /tmp/bazel-cache
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v4

      - name: Build dev image (layer-cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dev.Dockerfile
          tags: swarmforge-dev
          load: true
          cache-from: type=gha,scope=${{ matrix.image_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_scope }}

      # Own cache for optimised release builds; falls back to the normal lane for downloads.
      - name: Restore Bazel cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            /tmp/bazel-cache/bazel-disk
            /tmp/bazel-cache/bazel-repo
          key: bazel-release-${{ matrix.arch }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'docker/dev.Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            bazel-release-${{ matrix.arch }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'docker/dev.Dockerfile') }}-
            ${{ matrix.fallback_cache }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'docker/dev.Dockerfile') }}-

      - name: Build release binaries with Bazel
        run: ./scripts/dev.sh ./scripts/package.sh --config=ci

      - name: Build runtime images
        run: TAG=ci ./scripts/build_images.sh

      - name: Compose integration test
        env:
          DETECTOR_IMAGE: swarmforge/detector:ci
          FUSION_IMAGE: swarmforge/fusion-node:ci
        run: ./scripts/compose_test.sh

      - name: SBOM (fusion-node)
        uses: anchore/sbom-action@v0
        with:
          image: swarmforge/fusion-node:ci
          format: spdx-json
          output-file: sbom-fusion-node-${{ matrix.arch }}.spdx.json
          upload-artifact: false

      - name: SBOM (detector)
        uses: anchore/sbom-action@v0
        with:
          image: swarmforge/detector:ci
          format: spdx-json
          output-file: sbom-detector-${{ matrix.arch }}.spdx.json
          upload-artifact: false

      - name: Vulnerability scan, fail on critical (fusion-node)
        uses: anchore/scan-action@v5
        with:
          image: swarmforge/fusion-node:ci
          fail-build: true
          severity-cutoff: critical
          output-format: table

      - name: Vulnerability scan, fail on critical (detector)
        uses: anchore/scan-action@v5
        with:
          image: swarmforge/detector:ci
          fail-build: true
          severity-cutoff: critical
          output-format: table

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.arch }}
          path: sbom-*.spdx.json
          retention-days: 30

      # ---- main only: push architecture-specific tags ----
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.arch }} images
        if: github.ref == 'refs/heads/main'
        run: |
          short="${GITHUB_SHA::7}"
          for name in fusion-node detector; do
            ref="${REGISTRY}/${name}:sha-${short}-${ARCH}"
            docker tag "swarmforge/${name}:ci" "$ref"
            docker push "$ref"
          done

      - name: Save Bazel cache (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            /tmp/bazel-cache/bazel-disk
            /tmp/bazel-cache/bazel-repo
          key: ${{ steps.cache.outputs.cache-primary-key }}

  publish:
    name: Publish and sign multi-arch images
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing: cosign uses this job's GitHub OIDC identity
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: Create multi-arch tags, sign and verify
        run: |
          short="${GITHUB_SHA::7}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/images.yml@refs/heads/main"
          for name in fusion-node detector; do
            base="${REGISTRY}/${name}"
            docker buildx imagetools create \
              -t "${base}:sha-${short}" -t "${base}:main" \
              "${base}:sha-${short}-amd64" "${base}:sha-${short}-arm64"
            digest="$(docker buildx imagetools inspect "${base}:sha-${short}" --format '{{json .Manifest}}' | jq -r .digest)"

            # Sign the digest (never a tag): the signature covers exactly these bytes.
            cosign sign --yes --recursive "${base}@${digest}"
            cosign verify "${base}@${digest}" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

            echo "Signed and verified: ${base}@${digest}" | tee -a "$GITHUB_STEP_SUMMARY"
          done
