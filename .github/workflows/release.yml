name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      # A personal token, so that CI runs on the release PR (PRs opened with
      # GITHUB_TOKEN do not trigger workflows, and main requires green checks).
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish ${{ needs.release-please.outputs.tag_name }} to dev
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    environment: dev
    permissions:
      contents: write # upload release assets
      packages: write # add version and dev tags
      actions: read # read CI results and SBOM artifacts
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release-please.outputs.tag_name }}
      SHA: ${{ needs.release-please.outputs.sha }}
      REGISTRY: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      # Release only a commit on which every check passed.
      - name: Wait until CI and Images passed on the release commit
        run: ./scripts/wait_for_checks.sh "$SHA" ci.yml images.yml

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: Install crane
        run: ./scripts/install_crane.sh

      - name: Tag the tested, signed images with the version (no rebuild)
        run: ./scripts/release_images.sh

      - name: Attach SBOMs and release manifest to the GitHub Release
        run: |
          run_id="$(gh run list --workflow images.yml --commit "$SHA" --event push \
            --json databaseId,conclusion \
            -q '[.[] | select(.conclusion == "success")][0].databaseId')"
          gh run download "$run_id" --dir sboms --pattern 'sbom-*'
          gh release upload "$VERSION" sboms/*/*.spdx.json release-manifest.json --clobber
