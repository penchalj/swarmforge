name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older, now pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SKIP_IMAGE_BUILD: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build dev image (layer-cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dev.Dockerfile
          tags: swarmforge-dev
          load: true
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,mode=max,scope=dev-image

      - name: Check formatting and lint
        run: ./scripts/dev.sh ./scripts/lint.sh

  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SKIP_IMAGE_BUILD: "1"
      BAZEL_CACHE_DIR: /tmp/bazel-cache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, needed to diff a PR against main

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v4

      - name: Build dev image (layer-cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dev.Dockerfile
          tags: swarmforge-dev
          load: true
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,mode=max,scope=dev-image

      # Every run reads the cache; only main writes it (see the last step).
      - name: Restore Bazel cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            /tmp/bazel-cache/bazel-disk
            /tmp/bazel-cache/bazel-repo
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'docker/dev.Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'docker/dev.Dockerfile') }}-
            bazel-${{ runner.os }}-

      - name: Select tests
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "origin/${BASE_REF}...HEAD" | tee changed_files.txt
            targets=$(./scripts/dev.sh ./scripts/affected_tests.sh < changed_files.txt | tr '\n' ' ')
          else
            targets="//..."
          fi
          echo "Tests to run: ${targets:-none}"
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        if: steps.select.outputs.targets != ''
        env:
          TARGETS: ${{ steps.select.outputs.targets }}
        run: |
          # shellcheck disable=SC2086  # TARGETS is a space-separated list
          ./scripts/dev.sh bazel test --config=ci $TARGETS

      - name: No affected tests
        if: steps.select.outputs.targets == ''
        run: echo "This change does not affect any Bazel target."

      - name: Save Bazel cache (main only, prevents cache poisoning from PRs)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            /tmp/bazel-cache/bazel-disk
            /tmp/bazel-cache/bazel-repo
          key: ${{ steps.cache.outputs.cache-primary-key }}
