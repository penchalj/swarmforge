name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release to deploy, e.g. v0.1.0"
        required: true
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]
      rollback:
        description: "Rollback: skip the promotion-order check"
        type: boolean
        default: false

permissions:
  contents: read

# One promotion per environment at a time.
concurrency:
  group: promote-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.version }} to ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # production pauses here until a required reviewer approves.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
      VERSION: ${{ inputs.version }}
      TARGET: ${{ inputs.environment }}
      ROLLBACK: ${{ inputs.rollback }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: Install crane
        run: ./scripts/install_crane.sh

      - name: Verify, smoke-test and promote by digest
        run: ./scripts/promote.sh
