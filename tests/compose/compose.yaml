# End-to-end test of the runtime images: detector writes a scenario,
# fusion-node reads it and prints one track per target.
services:
  detector:
    image: ${DETECTOR_IMAGE:-swarmforge/detector:dev}
    command: ["--out=/data/scenario.pb", "--targets=3", "--seed=7"]
    volumes:
      - scenario:/data

  fusion-node:
    image: ${FUSION_IMAGE:-swarmforge/fusion-node:dev}
    command: ["/data/scenario.pb"]
    volumes:
      - scenario:/data:ro
    depends_on:
      detector:
        condition: service_completed_successfully

volumes:
  scenario:
